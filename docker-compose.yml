services:
  # E2E: imagem oficial do Playwright (glibc + browsers). O serviço `web` usa
  # Alpine e não suporta execução do Chromium do Playwright.
  e2e:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    environment:
      CI: "true"
    ipc: host
    init: true
    command: sh -c "npm ci --include=dev && npm run e2e"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      PORT: ${PORT:-3002}
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci --include=dev && npm run dev -- --host 0.0.0.0 --port ${PORT:-3002}"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  e2e_node_modules:
